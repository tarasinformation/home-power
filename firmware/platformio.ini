; Прошивка монітора світла для ESP32-C3 (PlatformIO, Arduino).
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Wi-Fi з TLS разом із Bluetooth не вміщаються у стандартний розділ 1,25 МБ.
; min_spiffs: два розділи програми по 1,9 МБ (флеш 4 МБ), оновлення по повітрю лишається можливим.
board_build.partitions = min_spiffs.csv
lib_deps =
    marian-craciunescu/ESP32Ping
; Для плат із вбудованим USB (Super Mini та подібні): журнал через USB-порт.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
